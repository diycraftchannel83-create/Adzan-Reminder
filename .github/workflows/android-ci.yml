name: Android CI
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download bundled Adhan MP3 assets
        run: |
          mkdir -p app/src/main/res/raw
          curl -L --fail --retry 3 -o app/src/main/res/raw/adhan_fajr.mp3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_01_Fajr_Adhan.mp3"
          curl -L --fail --retry 3 -o app/src/main/res/raw/adhan_dhuhr.mp3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_02_Dhuhr_Adhan.mp3"
          curl -L --fail --retry 3 -o app/src/main/res/raw/adhan_asr.mp3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_03_Asr_Adhan.mp3"
          curl -L --fail --retry 3 -o app/src/main/res/raw/adhan_maghrib.mp3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_04_Maghrib_Adhan.mp3"
          curl -L --fail --retry 3 -o app/src/main/res/raw/adhan_isha.mp3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_05_Isha_Adhan.mp3"
          ls -lh app/src/main/res/raw/
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path("app/src/main/res/raw").glob("adhan_*.mp3"))
          assert len(files) == 5, f"Expected 5 adhan files, got {len(files)}"
          for p in files:
              data = p.read_bytes()
              assert len(data) > 50_000, f"{p.name}: file too small or download failed"
              valid = data[:3] == b"ID3" or (len(data) > 1 and data[0] == 0xFF and (data[1] & 0xE0) == 0xE0)
              assert valid, f"{p.name}: invalid MP3 signature"
              print(f"Validated {p.name}: {len(data)} bytes")
          PY
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adzan-Reminder-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
